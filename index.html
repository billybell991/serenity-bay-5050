<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serenity Bay Social Committee</title>
    <!-- Tailwind CSS for super fast mobile styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(160deg, #0b2038 0%, #0f2d4d 45%, #091624 100%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        .draw-card {
            border-radius: 18px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .draw-card:active {
            transform: scale(0.97);
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }
        /* When the header background photo loads, hide the fallback emojis */
        header.has-media .hdr-emoji { display: none; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col">

    <!-- Fixed Header -->
    <header class="relative overflow-hidden bg-blue-600 text-white p-4 sticky top-0 z-20 text-center shadow-md">
        <div class="header-media absolute inset-0 z-0">
            <img src="./shared/img/camp.jpg" alt="" class="w-full h-full object-cover" onload="this.closest('header').classList.add('has-media')" onerror="this.parentElement.remove()">
            <div class="absolute inset-0 bg-gradient-to-b from-black/35 to-black/60"></div>
        </div>
        <h1 class="relative z-10 leading-none [text-shadow:0_1px_4px_rgba(0,0,0,0.55)]">
            <span class="block text-[11px] sm:text-xs font-semibold tracking-[0.25em] uppercase opacity-90 mb-1">Serenity Bay</span>
            <span class="block text-2xl font-bold whitespace-nowrap"><span class="hdr-emoji">&#9978; </span>Social Committee<span class="hdr-emoji"> &#9978;</span></span>
        </h1>
    </header>

    <!-- Landing content -->
    <main class="flex-1 flex flex-col p-5 gap-5 w-full max-w-md mx-auto">
        <!-- 50/50 Draw card -->
        <a href="./5050/"
           class="draw-card relative overflow-hidden flex-1 flex items-end min-h-[180px] text-white p-6 no-underline">
            <img src="./shared/img/5050.jpg" alt="" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-blue-950/90 via-blue-900/45 to-blue-900/10"></div>
            <div class="relative w-full flex items-center gap-4">
                <div class="flex-1">
                    <div class="text-3xl font-extrabold leading-tight [text-shadow:0_1px_4px_rgba(0,0,0,0.7)]">50/50 Draw</div>
                    <div class="text-blue-50 text-sm mt-1 [text-shadow:0_1px_4px_rgba(0,0,0,0.7)]">Weekly campground 50/50</div>
                </div>
                <span class="text-4xl font-bold [text-shadow:0_1px_4px_rgba(0,0,0,0.7)]">&rsaquo;</span>
            </div>
        </a>

        <!-- Booze Basket card -->
        <a href="./booze/"
           class="draw-card relative overflow-hidden flex-1 flex items-end min-h-[180px] text-white p-6 no-underline">
            <img src="./shared/img/booze.jpg" alt="" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-orange-950/90 via-orange-900/45 to-orange-900/10"></div>
            <div class="relative w-full flex items-center gap-4">
                <div class="flex-1">
                    <div class="text-3xl font-extrabold leading-tight [text-shadow:0_1px_4px_rgba(0,0,0,0.7)]">Booze Basket</div>
                    <div class="text-amber-50 text-sm mt-1 [text-shadow:0_1px_4px_rgba(0,0,0,0.7)]">Season-long basket draw</div>
                </div>
                <span class="text-4xl font-bold [text-shadow:0_1px_4px_rgba(0,0,0,0.7)]">&rsaquo;</span>
            </div>
        </a>
    </main>

    <footer class="text-center text-gray-400 text-xs py-4">
        Serenity Bay Social Committee
    </footer>

</body>
</html>
