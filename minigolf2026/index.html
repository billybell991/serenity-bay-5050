<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity Bay 2026 Mini Golf</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Leaflet Geoman CSS (kept only so script.js pm.* calls remain valid) -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css">

    <!-- Public build: force every admin control hidden regardless of inline styles -->
    <style>
        .admin-btn,
        #undo-btn,
        #freehand-btn,
        #paint-btn,
        #paint-controls { display: none !important; }
    </style>
</head>
<body>

    <!-- Container for the map -->
    <div id="map"></div>

    <!--
      Admin UI kept in the DOM (hidden) so script.js getElementById()/addEventListener
      calls stay valid. ADMIN_MODE = false keeps them non-functional and invisible.
    -->
    <button id="undo-btn" class="admin-btn">Undo Last Action</button>
    <button id="freehand-btn" class="admin-btn" style="top: 70px; display: none;">✏️ Freehand Draw</button>
    <button id="paint-btn" class="admin-btn" style="top: 110px; display: none;">🖌️ Paint</button>

    <div id="paint-controls" class="admin-control-panel paint-panel" style="display: none;">
        <div style="margin-bottom: 5px;">
            <label for="brush-size">Size: <span id="brush-size-val">10</span>px</label>
            <input type="range" id="brush-size" min="1" max="50" value="10" style="width: 100%;">
        </div>
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
            <input type="color" id="brush-color" value="#5a93b0">
            <button id="eyedropper-btn" style="padding: 2px 5px; cursor: pointer;">💉 Sample Color</button>
        </div>
        <button id="paint-commit-btn" style="width: 100%;">Finish &amp; Commit Strokes</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet Geoman JS (kept for map.pm.* API; no controls are added in public mode) -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <!-- Public map script (ADMIN_MODE = false) -->
    <script src="script.js"></script>

    <!-- html2canvas kept for parity with admin build (eyedropper is admin-only, never runs here) -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>
